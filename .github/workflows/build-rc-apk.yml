name: Build Android RC APKs

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: GitHub pre-release tag
        required: true
      release_name:
        description: GitHub pre-release title
        required: true
      notes_path:
        description: Repository-relative Markdown release notes
        required: true
        default: docs/v3.0.0-rc004-test001.md
      asset_prefix:
        description: APK file name prefix (without .apk)
        required: true
        default: ai-question-bank-android-v3.0.0-rc004-test001

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: android-app
        run: flutter pub get

      - name: Build standard RC APK
        working-directory: android-app
        run: |
          flutter build apk --release --no-pub --no-tree-shake-icons
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${{ inputs.asset_prefix }}.apk"

      - name: Build Internal Motion Lab APK
        working-directory: android-app
        run: |
          flutter build apk --release --no-pub --no-tree-shake-icons --dart-define=INTERNAL_BUILD=true
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${{ inputs.asset_prefix }}-internal.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.asset_prefix }}
          path: android-app/dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: ${{ github.ref_name }}
          name: ${{ inputs.release_name }}
          body_path: ${{ inputs.notes_path }}
          files: android-app/dist/*.apk
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
