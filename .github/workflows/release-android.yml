name: Release Android

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example android-v3.0.0-rc006'
        required: true
        type: string
      title:
        description: 'GitHub Release title'
        required: true
        type: string
      prerelease:
        description: 'Publish as a pre-release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test
        run: flutter test --no-pub --concurrency=1

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ai-question-bank-${{ inputs.tag }}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.title }}
          files: android-app/dist/*.apk
          draft: false
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
