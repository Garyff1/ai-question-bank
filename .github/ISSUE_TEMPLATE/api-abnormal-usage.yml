name: API 异常调用
description: 报告疑似重复请求、取消后继续请求或异常额度消耗
title: "[API异常] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## 安全提醒
        **DO NOT POST API KEYS. 请勿提交完整 API Key、Authorization Header、密码、JWT、完整 Prompt 或私人资料。**

        优先粘贴应用“API 使用记录”生成的脱敏诊断内容，并同时核对模型服务商控制台的最终用量。
  - type: input
    id: app_version
    attributes:
      label: App 版本
      placeholder: 例如 3.0.0+62
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android 版本与设备型号
      placeholder: 例如 Android 15 / Xiaomi 15（不要提交设备序列号）
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: 模型服务商
      placeholder: DeepSeek / Qwen / 智谱 / 硅基流动 / MiMo / Kimi / 自定义
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 模型名称
      placeholder: 只填写模型名，不要填写 Key
    validations:
      required: true
  - type: input
    id: occurred_at
    attributes:
      label: 问题发生时间
      placeholder: 例如 2026-08-08 20:30（时区）
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: 当时执行的操作
      description: 说明生成题数、题型、是否重试/取消/切后台。
    validations:
      required: true
  - type: input
    id: expected_requests
    attributes:
      label: 预计请求次数
      placeholder: 例如 1
    validations:
      required: true
  - type: input
    id: observed_requests
    attributes:
      label: 观察到的请求次数
      placeholder: 例如本机记录 3 次，服务商控制台 3 次
    validations:
      required: true
  - type: textarea
    id: redacted_record
    attributes:
      label: 脱敏任务记录
      description: 可粘贴 Task ID、请求次数、重试次数和错误分类；不要粘贴任何秘密或完整资料。
      render: text
  - type: textarea
    id: description
    attributes:
      label: 补充说明
    validations:
      required: true
  - type: checkboxes
    id: secret_check
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认内容中不包含完整 API Key、Authorization、密码、JWT 或私人资料。
          required: true
